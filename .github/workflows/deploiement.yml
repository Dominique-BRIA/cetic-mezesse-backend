name: API Azure

# À chaque push sur main : GitHub compile et teste l'API, puis envoie le jar (un seul fichier,
# prêt à lancer) sur Azure App Service. Azure ne compile et n'installe rien : il remplace app.jar
# et redémarre ; les migrations Flyway s'appliquent au démarrage.
#
# L'envoi sur Azure ne se fait que si la variable du dépôt DEPLOYER_SUR_AZURE vaut « oui »
# (Settings → Secrets and variables → Actions → Variables), une fois l'App Service passé en Java 21.
on:
  push:
    branches: [main]
    # La documentation seule ne redéploie pas l'API.
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: api-azure
  cancel-in-progress: false

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Le commit, lu par /api/sante : la vérification finale reconnaît ainsi la nouvelle version.
      - run: echo "$GITHUB_SHA" > src/main/resources/version-deployee.txt
      # Compilation, tests (calcul des résultats, règles de gestion) puis le jar.
      - run: mvn -B -ntp package
      - run: ls -lh target/cetic-api.jar
      - uses: actions/upload-artifact@v4
        with:
          name: cetic-api
          path: target/cetic-api.jar
          retention-days: 7

  deploiement:
    needs: jar
    if: vars.DEPLOYER_SUR_AZURE == 'oui'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cetic-api
      # Le jar est envoyé tel quel ; Azure (pile Java 21 SE) le lance sous le nom app.jar.
      # clean : le dossier du site est vidé avant l'envoi, il ne reste que le jar.
      - uses: azure/webapps-deploy@v3
        with:
          app-name: cetic-mezesse-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: cetic-api.jar
          type: jar
          clean: true
      # Azure redémarre plusieurs minutes après l'envoi : on attend le bon commit, puis une vraie
      # requête sur la connexion (formulaire vide : 400 attendu, rien n'est écrit). Cette route est
      # limitée à 20 appels par quart d'heure, d'où un seul essai, une fois la version reconnue.
      - name: Vérification de la nouvelle version
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 45); do
            if curl -fsS -m 60 "$API_URL/sante" | grep -q "\"version\":\"$GITHUB_SHA\""; then
              statut=$(curl -s -m 60 -o /dev/null -w '%{http_code}' -X POST "$API_URL/auth/connexion" -H 'Content-Type: application/json' -d '{}')
              if [ "$statut" = "400" ]; then echo "Nouvelle version en ligne, connexion opérationnelle"; exit 0; fi
              echo "Connexion : statut $statut"
            fi
            sleep 20
          done
          echo "::error::La version $GITHUB_SHA ne répond pas correctement sur $API_URL"
          exit 1
